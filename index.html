<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntra Systems | Soluções Digitais para o Próximo Nível</title>
<meta name="description" content="A Syntra Systems desenvolve websites, sistemas web, automações e soluções digitais para empresas que querem crescer com tecnologia.">
<meta name="theme-color" content="#050505">

<style>
:root{
    --bg:#050505;
    --bg-soft:#0b0b10;
    --card:#111118;
    --card-hover:#171722;
    --purple:#7c3aed;
    --purple-light:#a855f7;
    --purple-soft:rgba(168,85,247,.18);
    --white:#ffffff;
    --muted:#b7b7c5;
    --muted-2:#858596;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(168,85,247,.35);
    --green:#25d366;
    --shadow:0 0 60px rgba(124,58,237,.23);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--white);
    font-family:Inter,Segoe UI,Arial,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 80% 10%,rgba(124,58,237,.22),transparent 28%),
        radial-gradient(circle at 10% 80%,rgba(168,85,247,.13),transparent 30%),
        linear-gradient(180deg,#050505,#07070b 50%,#050505);
    z-index:-4;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 85%);
    z-index:-3;
    pointer-events:none;
}

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#050505;
}

::-webkit-scrollbar-thumb{
    background:#2d164d;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#7c3aed;
}

a{
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

.container{
    width:min(1180px,90%);
    margin:0 auto;
}

.cursor-glow{
    position:fixed;
    width:520px;
    height:520px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(168,85,247,.22) 0%,
        rgba(124,58,237,.11) 35%,
        transparent 70%
    );
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:-2;
    opacity:.9;
}

.particles{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
}

/* HEADER */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:999;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.navbar{
    height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
}

.brand-logo{
    width:46px;
    height:46px;
    border-radius:14px;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(168,85,247,.32));
}

.brand-text strong{
    display:block;
    font-size:1rem;
    letter-spacing:.08em;
}

.brand-text span{
    display:block;
    font-size:.76rem;
    color:var(--muted-2);
    margin-top:3px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:26px;
}

.nav-links a{
    text-decoration:none;
    color:#dedee8;
    font-size:.95rem;
    transition:.25s ease;
}

.nav-links a:hover{
    color:var(--purple-light);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-toggle{
    display:none;
    width:44px;
    height:44px;
    border:1px solid var(--border);
    border-radius:12px;
    background:rgba(255,255,255,.03);
    color:white;
    font-size:1.4rem;
    cursor:pointer;
}

/* BUTTONS */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:48px;
    padding:0 22px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--purple),var(--purple-light));
    color:white;
    text-decoration:none;
    font-weight:800;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 25px rgba(124,58,237,.28);
    transition:.3s ease;
    cursor:pointer;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 40px rgba(168,85,247,.45);
}

.btn-outline{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:48px;
    padding:0 22px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    font-weight:700;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    transition:.3s ease;
}

.btn-outline:hover{
    transform:translateY(-3px);
    border-color:var(--border-strong);
    background:rgba(168,85,247,.08);
}

/* HERO */

.hero{
    min-height:100vh;
    padding:150px 0 90px;
    display:flex;
    align-items:center;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:70px;
    align-items:center;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-radius:999px;
    background:rgba(168,85,247,.08);
    border:1px solid rgba(168,85,247,.25);
    color:#d8b4fe;
    font-weight:700;
    font-size:.88rem;
    margin-bottom:26px;
}

.hero h1{
    font-size:clamp(3rem,7vw,6.4rem);
    line-height:.95;
    letter-spacing:-.07em;
    max-width:780px;
}

.hero h1 span{
    display:block;
    background:linear-gradient(90deg,#ffffff,#d8b4fe,#8b5cf6);
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 0 45px rgba(168,85,247,.15);
}

.hero-description{
    margin-top:28px;
    max-width:680px;
    color:var(--muted);
    font-size:1.12rem;
    line-height:1.85;
}

.hero-buttons{
    margin-top:36px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.hero-trust{
    margin-top:32px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.trust-pill{
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    color:#d6d6e4;
    font-size:.9rem;
}

/* HERO VISUAL */

.hero-visual{
    position:relative;
}

.hero-visual::before{
    content:"";
    position:absolute;
    inset:-35px;
    background:radial-gradient(circle,rgba(168,85,247,.25),transparent 62%);
    filter:blur(20px);
    z-index:-1;
}

.dashboard{
    position:relative;
    padding:22px;
    border-radius:30px;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.dashboard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(168,85,247,.08),transparent);
    transform:translateX(-100%);
    animation:shine 7s infinite;
}

@keyframes shine{
    0%{transform:translateX(-100%);}
    45%{transform:translateX(120%);}
    100%{transform:translateX(120%);}
}

.dashboard-top{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.window-dots{
    display:flex;
    gap:8px;
}

.window-dots span{
    width:11px;
    height:11px;
    border-radius:50%;
    display:block;
}

.dot-red{background:#ff5f57;}
.dot-yellow{background:#ffbd2e;}
.dot-green{background:#28c840;}

.live-badge{
    font-size:.78rem;
    color:#c4b5fd;
    border:1px solid rgba(168,85,247,.25);
    border-radius:999px;
    padding:8px 12px;
    background:rgba(168,85,247,.07);
}

.metric-grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.metric{
    padding:20px;
    border-radius:20px;
    background:rgba(5,5,8,.64);
    border:1px solid var(--border);
}

.metric span{
    color:var(--muted-2);
    font-size:.85rem;
}

.metric strong{
    display:block;
    margin-top:8px;
    color:#d8b4fe;
    font-size:2rem;
}

.chart{
    position:relative;
    margin-top:16px;
    height:210px;
    border-radius:22px;
    background:
        linear-gradient(180deg,rgba(168,85,247,.7),rgba(124,58,237,.2),transparent),
        repeating-linear-gradient(to right,rgba(255,255,255,.045) 0 1px,transparent 1px 55px),
        repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 45px),
        #0b0b10;
    border:1px solid var(--border);
    overflow:hidden;
}

.chart::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:38px;
    height:90px;
    background:
        linear-gradient(135deg,transparent 0 10%,rgba(255,255,255,.92) 10% 12%,transparent 12% 24%,rgba(255,255,255,.92) 24% 26%,transparent 26% 38%,rgba(255,255,255,.92) 38% 40%,transparent 40% 54%,rgba(255,255,255,.92) 54% 56%,transparent 56%);
    opacity:.22;
    transform:skewY(-8deg);
}

.chart-bars{
    position:absolute;
    inset:auto 24px 24px 24px;
    height:100px;
    display:flex;
    align-items:flex-end;
    gap:12px;
}

.chart-bars span{
    flex:1;
    display:block;
    border-radius:10px 10px 0 0;
    background:linear-gradient(180deg,#d8b4fe,#7c3aed);
    box-shadow:0 0 20px rgba(168,85,247,.3);
}

.chart-bars span:nth-child(1){height:38%;}
.chart-bars span:nth-child(2){height:65%;}
.chart-bars span:nth-child(3){height:48%;}
.chart-bars span:nth-child(4){height:82%;}
.chart-bars span:nth-child(5){height:56%;}
.chart-bars span:nth-child(6){height:92%;}
.chart-bars span:nth-child(7){height:70%;}

/* COMMON SECTIONS */

.section{
    padding:110px 0;
    position:relative;
}

.section-header{
    text-align:center;
    max-width:780px;
    margin:0 auto 58px;
}

.section-kicker{
    color:#c084fc;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:.78rem;
    margin-bottom:14px;
}

.section-title{
    font-size:clamp(2.2rem,5vw,4.4rem);
    line-height:1.05;
    letter-spacing:-.05em;
}

.section-description{
    margin-top:18px;
    color:var(--muted);
    line-height:1.8;
    font-size:1.05rem;
}

/* STATS */

.stats-strip{
    padding:10px 0 80px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.stat-card{
    padding:26px;
    border-radius:22px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
    text-align:center;
    transition:.3s ease;
}

.stat-card:hover{
    transform:translateY(-6px);
    border-color:var(--border-strong);
}

.stat-card strong{
    display:block;
    font-size:2.3rem;
    color:#d8b4fe;
}

.stat-card span{
    display:block;
    margin-top:8px;
    color:var(--muted);
}

/* SERVICES */

.cards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.service-card{
    position:relative;
    padding:30px;
    min-height:260px;
    border-radius:26px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    overflow:hidden;
    transition:.35s ease;
}

.service-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-80px;
    top:-80px;
    background:radial-gradient(circle,rgba(168,85,247,.34),transparent 70%);
    opacity:0;
    transition:.35s ease;
}

.service-card:hover{
    transform:translateY(-10px);
    border-color:var(--border-strong);
    background:rgba(255,255,255,.055);
}

.service-card:hover::before{
    opacity:1;
}

.service-icon{
    width:54px;
    height:54px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(168,85,247,.12));
    border:1px solid rgba(168,85,247,.2);
    font-size:1.5rem;
    margin-bottom:22px;
}

.service-card h3{
    font-size:1.35rem;
    margin-bottom:14px;
}

.service-card p{
    color:var(--muted);
    line-height:1.75;
}

/* DIFFERENTIALS */

.diff-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    align-items:stretch;
}

.diff-main{
    padding:42px;
    border-radius:30px;
    background:
        radial-gradient(circle at top right,rgba(168,85,247,.2),transparent 35%),
        rgba(255,255,255,.035);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);
}

.diff-main h2{
    font-size:clamp(2rem,4vw,3.7rem);
    line-height:1.05;
    letter-spacing:-.05em;
    margin-bottom:22px;
}

.diff-main p{
    color:var(--muted);
    line-height:1.8;
}

.diff-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.diff-item{
    padding:24px;
    border-radius:24px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
