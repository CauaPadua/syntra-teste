<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Syntra Systems | Soluções Digitais</title>

  <meta name="description" content="A Syntra Systems desenvolve sites, sistemas web, automações, dashboards e soluções digitais para empresas." />
  <meta name="theme-color" content="#050505" />

  <style>
    :root {
      --bg: #050505;
      --bg-soft: #0b0b10;
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --purple: #7c3aed;
      --purple-light: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.18);
      --text: #ffffff;
      --muted: #b7b7c7;
      --muted-2: #85859a;
      --green: #25d366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, Arial, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -5;
      background:
        radial-gradient(circle at 80% 10%, rgba(124, 58, 237, 0.28), transparent 32%),
        radial-gradient(circle at 10% 85%, rgba(168, 85, 247, 0.16), transparent 34%),
        linear-gradient(180deg, #050505, #07070b 48%, #050505);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 58px 58px;
      pointer-events: none;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, 90%);
      margin: 0 auto;
    }

    .cursor-glow {
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(168, 85, 247, 0.22) 0%,
        rgba(124, 58, 237, 0.10) 38%,
        transparent 70%
      );
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: -3;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      background: rgba(5, 5, 5, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.35));
    }

    .brand strong {
      display: block;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      color: var(--muted-2);
      font-size: 0.78rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #e5e5ee;
      text-decoration: none;
      font-size: 0.95rem;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: #d8b4fe;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      color: white;
      font-size: 1.35rem;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: white;
      text-decoration: none;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 0 28px rgba(124, 58, 237, 0.28);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 42px rgba(168, 85, 247, 0.42);
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: white;
      text-decoration: none;
      font-weight: 700;
      border: 1px solid var(--border);
      transition: 0.3s ease;
    }

    .btn-outline:hover {
      transform: translateY(-3px);
      border-color: rgba(168, 85, 247, 0.45);
      background: rgba(168, 85, 247, 0.08);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 150px 0 90px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.25);
      color: #d8b4fe;
      font-weight: 800;
      font-size: 0.88rem;
      margin-bottom: 26px;
    }

    .hero h1 {
      font-size: clamp(3rem, 7vw, 6.15rem);
      line-height: 0.96;
      letter-spacing: -0.07em;
    }

    .hero h1 span {
      display: block;
      background: linear-gradient(90deg, #ffffff, #d8b4fe, #8b5cf6);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-description {
      margin-top: 28px;
      max-width: 650px;
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.85;
    }

    .hero-buttons {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .trust-row {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .trust-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      color: #d6d6e4;
      font-size: 0.9rem;
    }

    .hero-visual {
      position: relative;
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      inset: -35px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 62%);
      filter: blur(22px);
      z-index: -1;
    }

    .dashboard {
      position: relative;
      padding: 22px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.025));
      border: 1px solid var(--border);
      box-shadow: 0 0 65px rgba(124, 58, 237, 0.22);
      overflow: hidden;
    }

    .dashboard-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .red { background: #ff5f57; }
    .yellow { background: #ffbd2e; }
    .green { background: #28c840; }

    .live {
      font-size: 0.78rem;
      color: #d8b4fe;
      border: 1px solid rgba(168,85,247,0.25);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(168,85,247,0.07);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .metric {
      padding: 20px;
      border-radius: 20px;
      background: rgba(5,5,8,0.64);
      border: 1px solid var(--border);
    }

    .metric span {
      display: block;
      color: var(--muted-2);
      font-size: 0.85rem;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      color: #d8b4fe;
      font-size: 1.85rem;
    }

    .chart {
      position: relative;
      margin-top: 16px;
      height: 210px;
      border-radius: 22px;
      background:
        repeating-linear-gradient(to right, rgba(255,255,255,0.045) 0 1px, transparent 1px 55px),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.045) 0 1px, transparent 1px 45px),
        linear-gradient(180deg, rgba(168,85,247,0.45), rgba(124,58,237,0.12), transparent),
        #0b0b10;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .chart-bars {
      position: absolute;
      inset: auto 24px 24px 24px;
      height: 105px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .chart-bars span {
      flex: 1;
      display: block;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, #d8b4fe, #7c3aed);
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
    }

    .chart-bars span:nth-child(1) { height: 38%; }
    .chart-bars span:nth-child(2) { height: 65%; }
    .chart-bars span:nth-child(3) { height: 48%; }
    .chart-bars span:nth-child(4) { height: 82%; }
    .chart-bars span:nth-child(5) { height: 56%; }
    .chart-bars span:nth-child(6) { height: 92%; }
    .chart-bars span:nth-child(7) { height: 70%; }

    .section {
      padding: 105px 0;
    }

    .section-header {
      text-align: center;
      max-width: 790px;
      margin: 0 auto 58px;
    }

    .kicker {
      color: #c084fc;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.78rem;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: clamp(2.2rem, 5vw, 4.25rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    .section-description {
      margin-top: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .stats-strip {
      padding: 10px 0 80px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .stat-card {
      padding: 26px;
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      text-align: center;
      transition: 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-6px);
      border-color: rgba(168,85,247,0.45);
    }

    .stat-card strong {
      display: block;
      font-size: 2.05rem;
      color: #d8b4fe;
    }

    .stat-card span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .service-card {
      position: relative;
      min-height: 260px;
      padding: 30px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      overflow: hidden;
      transition: 0.35s ease;
    }

    .service-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -80px;
      top: -80px;
      background: radial-gradient(circle, rgba(168,85,247,0.34), transparent 70%);
      opacity: 0;
      transition: 0.35s ease;
    }

    .service-card:hover {
      transform: translateY(-10px);
      border-color: rgba(168,85,247,0.45);
      background: var(--card-hover);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(168,85,247,0.12));
      border: 1px solid rgba(168,85,247,0.2);
      font-size: 1.5rem;
      margin-bottom: 22px;
    }

    .service-card h3 {
      font-size: 1.35rem;
      margin-bottom: 14px;
    }

    .service-card p {
      color: var(--muted);
      line-height: 1.75;
    }

    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .diff-main {
      padding: 42px;
      border-radius: 30px;
      background:
        radial-gradient(circle at top right, rgba(168,85,247,0.20), transparent 35%),
        var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .diff-main h2 {
      font-size: clamp(2rem, 4vw, 3.65rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
      margin-bottom: 22px;
    }

    .diff-main p {
      color: var(--muted);
      line-height: 1.8;
    }

    .diff-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .diff-item {
      padding: 24px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      transition: 0.3s ease;
    }

    .diff-item:hover {
      transform: translateY(-6px);
      border-color: rgba(168,85,247,0.45);
    }

    .diff-item strong {
      display: block;
      margin-bottom: 8px;
    }

    .diff-item span {
      display: block;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .tech-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .tech-badge {
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: #e8e8f5;
      font-weight: 800;
      transition: 0.3s ease;
    }

    .tech-badge:hover {
      transform: translateY(-5px);
      border-color: rgba(168,85,247,0.45);
      color: #d8b4fe;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .project-card {
      position: relative;
      min-height: 310px;
      padding: 28px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 80% 20%, rgba(168,85,247,0.22), transparent 35%),
        var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: 0.35s ease;
    }

    .project-card:hover {
      transform: translateY(-10px);
      border-color: rgba(168,85,247,0.45);
      box-shadow: 0 0 40px rgba(124,58,237,0.22);
    }

    .project-tag {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(168,85,247,0.1);
      color: #d8b4fe;
      border: 1px solid rgba(168,85,247,0.25);
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .project-card h3 {
      font-size: 1.55rem;
      margin-bottom: 12px;
    }

    .project-card p {
      color: var(--muted);
      line-height: 1.7;
      max-width: 520px;
    }

    .project-mock {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 26px;
      height: 98px;
      border-radius: 20px;
      background:
        repeating-linear-gradient(to right, rgba(255,255,255,0.06) 0 1px, transparent 1px 48px),
        linear-gradient(135deg, rgba(168,85,247,0.32), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
    }

    .project-mock::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 14px;
      background: linear-gradient(90deg, #7c3aed, #a855f7, transparent);
      opacity: 0.45;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 34px;
      align-items: center;
    }

    .about-logo-box {
      min-height: 420px;
      border-radius: 34px;
      background:
        radial-gradient(circle, rgba(168,85,247,0.22), transparent 48%),
        var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(18px);
    }

    .about-logo-box img {
      width: 220px;
      opacity: 0.96;
      filter: drop-shadow(0 0 38px rgba(168,85,247,0.34));
    }

    .about-content h2 {
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
      margin-bottom: 22px;
    }

    .about-content p {
      color: var(--muted);
      line-height: 1.85;
      margin-bottom: 18px;
      font-size: 1.04rem;
    }

    .location-pills {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .location-pills span {
      padding: 11px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: #dcdcec;
    }

    .cta-box {
      position: relative;
      padding: 76px 34px;
      border-radius: 34px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(168,85,247,0.24), transparent 42%),
        var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .cta-box h2 {
      font-size: clamp(2.4rem, 6vw, 5rem);
      line-height: 1;
      letter-spacing: -0.06em;
      margin-bottom: 20px;
    }

    .cta-box p {
      max-width: 620px;
      margin: 0 auto 30px;
      color: var(--muted);
      line-height: 1.8;
    }

    .footer {
      padding: 70px 0 34px;
      border-top: 1px solid
